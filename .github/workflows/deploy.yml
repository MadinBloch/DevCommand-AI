name: CI/CD - DevCommand AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcommand-ai-production
  cancel-in-progress: false

jobs:
  build:
    name: Build backend and frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Generate Prisma client
        run: npm --prefix backend run prisma:generate

      - name: Build backend
        run: npm --prefix backend run build

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm --prefix frontend run build

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu

          test -n "$EC2_SSH_KEY" || {
            echo "Missing GitHub secret EC2_SSH_KEY"
            exit 1
          }

          test -n "$EC2_HOST" || {
            echo "Missing GitHub secret EC2_HOST"
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application and run database migrations
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -eu

          test -n "$EC2_USER" || {
            echo "Missing GitHub secret EC2_USER"
            exit 1
          }

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail

          cd /var/www/DevCommand-AI

          echo "Fetching latest source..."
          git fetch origin main
          git reset --hard origin/main

          if ! swapon --show | grep -q '/swapfile'; then
            echo "Creating swap file for low-memory EC2 instance..."
            sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          fi

          export NODE_OPTIONS="--max_old_space_size=1024"
          export npm_config_cache="/tmp/npm-cache"

          echo "Installing backend dependencies..."
          npm ci --prefix backend --no-audit --no-fund

          echo "Installing frontend dependencies..."
          npm ci --prefix frontend --no-audit --no-fund

          echo "Generating Prisma client..."
          NODE_OPTIONS="$NODE_OPTIONS" npm --prefix backend run prisma:generate

          echo "Applying database migrations..."
          NODE_OPTIONS="$NODE_OPTIONS" npm --prefix backend run prisma:migrate

          echo "Building backend..."
          NODE_OPTIONS="$NODE_OPTIONS" npm --prefix backend run build

          echo "Configuring frontend API URL..."
          printf 'VITE_API_BASE_URL=/api\n' > frontend/.env.production

          echo "Building frontend..."
          NODE_OPTIONS="$NODE_OPTIONS" npm --prefix frontend run build

          echo "Restarting backend..."
          if pm2 describe devcommand-api >/dev/null 2>&1; then
            pm2 restart devcommand-api --update-env
          else
            pm2 start dist/server.js \
              --name devcommand-api \
              --cwd /var/www/DevCommand-AI/backend
          fi

          pm2 save

          echo "Checking Nginx configuration..."
          nginx -t
          systemctl reload nginx

          echo "Waiting for backend health check..."

          health_ok=0

          for i in $(seq 1 12); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4000/api/health; then
              echo
              echo "Health check passed."
              health_ok=1
              break
            fi

            echo "Backend not ready yet; retry $i/12"
            sleep 5
          done

          if [ "$health_ok" -ne 1 ]; then
            echo "Health check failed after retries."
            pm2 status
            pm2 logs devcommand-api --lines 80 --nostream || true
            exit 1
          fi

          echo "Deployment completed successfully."
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

