services:
  - type: web
    name: devcommand-ai-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: AGENT_MODE
        value: manual
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTIGRAVITY_API_URL
        sync: false
      - key: CODEX_API_URL
        sync: false
  - type: web
    name: devcommand-ai-web
    runtime: static
    plan: free
    region: singapore
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
databases:
  - name: devcommand-ai-db
    plan: free
    region: singapore
    databaseName: devcommand_ai